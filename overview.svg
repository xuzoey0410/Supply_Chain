ect x="800" y="260" width="352" height="192" rx="12" fill="#ffffff" stroke="#dce6e9"/><rect x="820" y="280" width="5" height="21" rx="2" fill="#5c75b7"/><text x="836" y="299" font-size="19" fill="#182c3d">Demand +20%</text><text x="822" y="334" font-size="14" fill="#657a86">8 testers / 1.2x demand</text><text x="822" y="396" font-size="43" fill="#5c75b7">13</text><text x="993" y="396" font-size="43" fill="#5c75b7">4</text><text x="822" y="423" font-size="11" fill="#657a86">PREBUILD / WEEKS</text><text x="993" y="423" font-size="11" fill="#657a86">REACH VIOLATIONS</text><text x="48" y="496" font-size="12" fill="#19766c">READ THE TRADE-OFF</text><text x="48" y="530" font-size="18" fill="#182c3d">Capacity -25%: 8 to 6 testers | maximum prebuild 1 to 22 weeks.</text><text x="48" y="564" font-size="16" fill="#657a86">Different demand or service objectives: inspect the stress test without ranking it as better.</text><text x="48" y="612" font-size="11" fill="#768993">COMPUTED SYNTHETIC DATA / HEURISTIC PLANNING / THIS ILLUSTRATION IS NOT A UI SCREENSHOT</text></g></svg>