services:
  api:
    build: .
    command: ["python", "-m", "uvicorn", "api_server:app_factory", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SUPPLY_MODE: public
      SUPPLY_API_DATA_DIR: /data
      SUPPLY_API_SERVICE_TOKEN: ${SUPPLY_API_SERVICE_TOKEN:?Set a random service credential of at least 24 characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      SUPPLY_ACCESS_CODE: ${SUPPLY_ACCESS_CODE:-}
      SUPPLY_HOURLY_RUNS: ${SUPPLY_HOURLY_RUNS:-20}
    volumes:
      - api-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  web:
    build: .
    environment:
      SUPPLY_MODE: public
      SUPPLY_API_URL: http://api:8000
      SUPPLY_API_SERVICE_TOKEN: ${SUPPLY_API_SERVICE_TOKEN:?Set a random service credential of at least 24 characters}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8504:8501"
    restart: unless-stopped
volumes:
  api-data:
